<!doctype html>
<html>
  <head>
    <style>
      body {
        background: #0c0713;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      svg {
        width: 80vw;
        max-width: 700px;
        overflow: visible;
      }

      .base {
        /* dim static trace */
        fill: none;
        stroke: #731fba;
        stroke-width: 2;
        opacity: 0.5;
      }
      .pulse {
        /* bright moving segment */
        fill: none;
        stroke: #ec74f9;
        stroke-width: 3;
        stroke-dasharray: 40 360; /* 40px lit, 360px gap */
        filter: drop-shadow(0 0 6px #ec74f9);
        animation: travel 7s linear infinite;
      }
      .pad {
        fill: #22a7f1;
        filter: drop-shadow(0 0 6px #22a7f1);
      }

      @keyframes travel {
        to {
          stroke-dashoffset: -400;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 400 120">
      <path class="base" d="M0 80h120l40-40h120l40 40h80" />
      <path class="pulse" d="M0 80h120l40-40h120l40 40h80" />
      <circle class="pad" cx="120" cy="80" r="5" />
      <circle class="pad" cx="280" cy="40" r="5" />
    </svg>
  </body>
</html>
